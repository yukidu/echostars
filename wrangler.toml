#:schema node_modules/wrangler/config-schema.json
name = "echostars"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 靜態前端資源 (Vite build 產出之 dist 目錄)
[assets]
directory = "./dist"
binding = "ASSETS"

# [選用] 待建立好 D1 資料庫後，可解除註解並填入實際 database_id:
# [[d1_databases]]
# binding = "DB"
# database_name = "echoes_db"
# database_id = "填入真實-d1-database-id"

# [選用] 待建立好 R2 儲存桶後，可解除註解並填入真實 bucket_name (如 audio-files):
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "audio-files"

# [選用] 待建立好 KV 命名空間後，可解除註解並填入真實 id:
# [[kv_namespaces]]
# binding = "KV"
# id = "填入真實-kv-namespace-id"

[vars]
ENVIRONMENT = "production"

